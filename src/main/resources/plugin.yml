name: CH-ChunkLoader
main: com.ch.chunkloader.CHChunkLoader
version: 1.1
api-version: '1.21'
description: 신호기 아머스탠드 청크로더 (설치 위치 기준 범위 설정 가능한 청크 상시 로드)
commands:
  chunkloaderitem:
    description: Set the held item as a chunk loader item (type = key under loaders in config.yml)
    aliases: [손에든아이템청크로더설정]
    usage: /chunkloaderitem [type]
permissions:
  chunkloader.admin:
    description: 청크로더 아이템 설정 / 다른 유저의 청크로더 철거
    default: op
